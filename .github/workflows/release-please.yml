name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      cli_tag: ${{ steps.resolve.outputs.cli_tag }}
      scanner_tag: ${{ steps.resolve.outputs.scanner_tag }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        if: github.event_name != 'workflow_dispatch'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release outputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "cli_tag=ghss-cli-v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "scanner_tag=ghss-scanner-v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=${{ steps.release.outputs.releases_created }}" >> "$GITHUB_OUTPUT"
            echo "cli_tag=${{ steps.release.outputs['ghss-cli--tag_name'] }}" >> "$GITHUB_OUTPUT"
            echo "scanner_tag=${{ steps.release.outputs['ghss-scanner--tag_name'] }}" >> "$GITHUB_OUTPUT"
          fi

  build-cli:
    needs: release-please
    if: needs.release-please.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ghss-linux-amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: ghss-linux-arm64
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            artifact: ghss-darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-all-crates: "true"

      - name: Build CLI binary
        run: cargo build --release --package ghss-cli --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/ghss ${{ matrix.artifact }}

      - name: Attest CLI binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-docker-amd64:
    needs: release-please
    if: needs.release-please.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/valinora/ghss-scanner

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ghss-scanner/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/valinora/ghss-scanner:${{ needs.release-please.outputs.scanner_tag }}-linux-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-linux/amd64
          cache-to: type=gha,scope=docker-linux/amd64,mode=max

      - name: Attest Docker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/valinora/ghss-scanner
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  build-docker-arm64:
    needs: release-please
    if: needs.release-please.outputs.should_release == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/valinora/ghss-scanner

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ghss-scanner/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ghcr.io/valinora/ghss-scanner:${{ needs.release-please.outputs.scanner_tag }}-linux-arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-linux/arm64
          cache-to: type=gha,scope=docker-linux/arm64,mode=max

      - name: Attest Docker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/valinora/ghss-scanner
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  merge-docker:
    runs-on: ubuntu-latest
    needs: [release-please, build-docker-amd64, build-docker-arm64]
    if: needs.release-please.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from tag
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.scanner_tag }}"
          VERSION="${TAG#ghss-scanner-v}"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          REST="${VERSION#*.}"
          echo "minor=${REST%%.*}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/valinora/ghss-scanner
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=v${{ steps.version.outputs.major }}
            type=raw,value=v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=v${{ steps.version.outputs.version }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ghcr.io/valinora/ghss-scanner:${{ needs.release-please.outputs.scanner_tag }}-linux-amd64 \
            ghcr.io/valinora/ghss-scanner:${{ needs.release-please.outputs.scanner_tag }}-linux-arm64

      - name: Inspect manifest
        id: inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/valinora/ghss-scanner:$(echo "$DOCKER_METADATA_OUTPUT_JSON" | jq -r '.tags[0]' | cut -d: -f2)" \
            --format '{{json .Manifest}}' | jq -r '.digest' > /tmp/manifest-digest
          echo "digest=$(cat /tmp/manifest-digest)" >> "$GITHUB_OUTPUT"

      - name: Attest manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/valinora/ghss-scanner
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  release-assets:
    runs-on: ubuntu-latest
    needs: [release-please, build-cli, merge-docker]
    if: needs.release-please.outputs.should_release == 'true'
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghss-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ghss-* > checksums-sha256.txt

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.cli_tag }}" ghss-* checksums-sha256.txt --repo "$GITHUB_REPOSITORY"
